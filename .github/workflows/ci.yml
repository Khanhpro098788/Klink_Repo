name: CI Pipeline

on:
  push:
    branches: [ "main", "deploy" ]

jobs:
  test-python-code:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/base.txt'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements/base.txt -r backend/requirements/dev.txt
      - name: Run tests
        working-directory: ./backend
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

  build-docker-image:
    needs: test-python-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            asia-southeast1-docker.pkg.dev/klink-deploy-2026/fastapi-demo/fastapi-demo-project:${{ github.sha }}
            asia-southeast1-docker.pkg.dev/klink-deploy-2026/fastapi-demo/fastapi-demo-project:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- BỔ SUNG BƯỚC DEPLOY LÊN CLOUD RUN DƯỚI ĐÂY ---
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fastapi-demo-project --image asia-southeast1-docker.pkg.dev/klink-deploy-2026/fastapi-demo/fastapi-demo-project:${{ github.sha }} --platform managed --region asia-southeast1 --allow-unauthenticated --port 8080
