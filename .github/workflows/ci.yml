name: CI Pipeline

on:
  push:
    branches: [ "main", "deploy" ]

jobs:
  test-python-code:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/base.txt'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements/base.txt -r backend/requirements/dev.txt
      - name: Run tests
        working-directory: ./backend
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

  build-docker-image:
    needs: test-python-code
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Yêu cầu bắt buộc để lấy Token từ GitHub OIDC nhằm xác thực WIF
    steps:
      - uses: actions/checkout@v4
      
      # 1. Xác thực Google Cloud bằng WIF
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/361539172913/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-ci-sa@klink-deploy-2026.iam.gserviceaccount.com'
      
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 2. Build & Push Backend Docker Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            asia-southeast1-docker.pkg.dev/klink-deploy-2026/fastapi-demo/fastapi-demo-project:${{ github.sha }}
            asia-southeast1-docker.pkg.dev/klink-deploy-2026/fastapi-demo/fastapi-demo-project:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Lấy URL Backend hiện tại để inject vào Frontend lúc build
      - name: Get Backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe fastapi-demo-project --region asia-southeast1 --project klink-deploy-2026 --format="value(status.url)" || echo "https://fastapi-demo-project-361539172913.asia-southeast1.run.app")
          echo "url=$URL" >> $GITHUB_OUTPUT

      # 4. Build & Push Frontend Docker Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          file: ./frontend-web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ steps.backend-url.outputs.url }}
          tags: |
            asia-southeast1-docker.pkg.dev/klink-deploy-2026/fastapi-demo/frontend-web:${{ github.sha }}
            asia-southeast1-docker.pkg.dev/klink-deploy-2026/fastapi-demo/frontend-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Triển khai Backend lên Cloud Run (Đổi sang --allow-unauthenticated để cho phép Frontend gọi API)
      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy fastapi-demo-project --image asia-southeast1-docker.pkg.dev/klink-deploy-2026/fastapi-demo/fastapi-demo-project:${{ github.sha }} --platform managed --region asia-southeast1 --allow-unauthenticated --project klink-deploy-2026 --service-account=cloudrun-runtime-sa@klink-deploy-2026.iam.gserviceaccount.com

      # 6. Triển khai Frontend lên Cloud Run (Cho phép public truy cập)
      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy frontend-service --image asia-southeast1-docker.pkg.dev/klink-deploy-2026/fastapi-demo/frontend-web:${{ github.sha }} --platform managed --region asia-southeast1 --allow-unauthenticated --project klink-deploy-2026 --service-account=cloudrun-runtime-sa@klink-deploy-2026.iam.gserviceaccount.com
