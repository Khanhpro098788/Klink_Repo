version: "3.8"

services:
  # ==========================================
  # REDIS - Pub/Sub for Real-time Video Render Progress
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: klink-redis
    ports:
      - "6379:6379"
    restart: always

  # ==========================================
  # QDRANT - Vector Database for AI RAG Director
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: klink-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # ==========================================
  # TEMPORAL.IO - Database for workflow persistence
  # ==========================================
  temporal-db:
    image: postgres:15-alpine
    container_name: klink-temporal-db
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_password
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  # ==========================================
  # TEMPORAL.IO - Orchestration Server
  # ==========================================
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: klink-temporal-server
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal_password
      - POSTGRES_SEEDS=temporal-db
    depends_on:
      - temporal-db
    restart: always

  temporal-ui:
    image: temporalio/ui:2.20.0
    container_name: klink-temporal-ui
    ports:
      - "8085:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    restart: always

volumes:
  qdrant_data:
  temporal_db_data:
